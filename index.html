<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Background Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link to the new space theme CSS -->
    <link rel="stylesheet" href="space-theme.css">
</head>

<body>
    <h1>Voxel Background Generator by levi l/Muskiei</h1>

    <div id="controls">
        <div>
            <label for="widthInput">Width</label>
            <input type="number" id="widthInput" value="512" min="100" max="2048"/>
        </div>
        <div>
            <label for="heightInput">Height</label>
            <input type="number" id="heightInput" value="512" min="100" max="2048"/>
        </div>
        <div>
            <label for="noisinessInput">Shape Count</label>
            <input type="number" id="noisinessInput" value="100" min="10" max="1000" />
        </div>
         <div>
            <label for="noiseDensityInput">Noise Density</label>
            <input type="number" id="noiseDensityInput" value="200" min="0" max="1000" />
        </div>
        <div>
            <label for="bgColorInput">Base Color</label>
            <input type="color" id="bgColorInput" value="#1a2b40" /> <!-- Updated default color -->
        </div>
         <div>
            <label for="accentColorInput">Accent Color</label>
            <input type="color" id="accentColorInput" value="#61dafb" /> <!-- New accent color input -->
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="generate()">Generate</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="downloadImage()">Download PNG</button>
        </div>
    </div>

    <canvas id="bg"></canvas>

    <script>
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");

        // Helper function to darken a hex color
        function darkenColor(color, percent) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.max(0, Math.floor(r * (1 - percent / 100)));
            g = Math.max(0, Math.floor(g * (1 - percent / 100)));
            b = Math.max(0, Math.floor(b * (1 - percent / 100)));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        // Helper function to lighten a hex color (kept from original)
        function lightenColor(color, percent) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * (percent / 100)));
            g = Math.min(255, Math.floor(g + (255 - g) * (percent / 100)));
            b = Math.min(255, Math.floor(b + (255 - b) * (percent / 100)));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }


        function generate() {
            // Remove viewport/controls height logic - use input values directly
            const width = parseInt(document.getElementById("widthInput").value, 10);
            const height = parseInt(document.getElementById("heightInput").value, 10);
            const noisiness = parseInt(document.getElementById("noisinessInput").value, 10); // Now shape count
            const noiseDensity = parseInt(document.getElementById("noiseDensityInput").value, 10); // New noise point count
            const bgColor = document.getElementById("bgColorInput").value;
            const accentColor = document.getElementById("accentColorInput").value; // Get accent color

            // Validate inputs (basic)
            if (isNaN(width) || width < 100 || width > 2048 ||
                isNaN(height) || height < 100 || height > 2048 ||
                isNaN(noisiness) || noisiness < 10 || noisiness > 1000 ||
                isNaN(noiseDensity) || noiseDensity < 0 || noiseDensity > 1000) {
                console.error("Invalid input values.");
                alert("Please enter valid numbers for width, height, shape count (10-1000), and noise density (0-1000).");
                return;
            }


            canvas.width = width;
            canvas.height = height;

            drawBackground(width, height, noisiness, noiseDensity, bgColor, accentColor);
        }

        function drawBackground(width, height, shapeCount, noiseDensity, bgColor, accentColor) {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Layer 1: Background Gradient
            const bottomColor = bgColor;
            const topColor = lightenColor(bgColor, 20); // Slightly lighter top color
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(1, bottomColor);
            gradient.addColorStop(0, topColor);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Layer 2: Center Highlight (Subtle glow)
            const centerHighlight = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) / 3);
            centerHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.05)'); // More subtle
            centerHighlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerHighlight;
            ctx.fillRect(0, 0, width, height);

            // Layer 3: Main Voxel/Shape Layer
            // Draw multiple rotated squares with varying size, alpha, and color
            const maxShapeAttempts = shapeCount * 10; // Prevent infinite loops
            for (let i = 0; i < shapeCount; i++) {
                const size = Math.random() * 40 + 20; // Larger size range
                const x = Math.random() * width;
                const y = Math.random() * height;

                // Vary alpha slightly
                const alpha = Math.random() * 0.08 + 0.02; // Alpha between 0.02 and 0.1

                // Vary color - use a darker shade of the base color
                const darkenPercent = Math.random() * 30 + 30; // Darken by 30-60%
                const shapeColor = darkenColor(bgColor, darkenPercent);

                // Random rotation
                const rotationDegrees = Math.random() * 360;
                const rotationRadians = rotationDegrees * (Math.PI / 180);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotationRadians);
                ctx.fillStyle = `rgba(${parseInt(shapeColor.slice(1,3), 16)}, ${parseInt(shapeColor.slice(3,5), 16)}, ${parseInt(shapeColor.slice(5,7), 16)}, ${alpha})`;
                ctx.fillRect(-size / 2, -size / 2, size, size);
                ctx.restore();
            }

            // Layer 4: Noise/Star Layer
            // Draw many small points with low alpha, some using accent color
            const maxNoiseAttempts = noiseDensity * 10; // Prevent infinite loops
             for (let i = 0; i < noiseDensity; i++) {
                const size = Math.random() * 2 + 1; // Very small size (1 to 3)
                const x = Math.random() * width;
                const y = Math.random() * height;

                const alpha = Math.random() * 0.04 + 0.01; // Very low alpha (0.01 to 0.05)

                // Occasionally use the accent color for noise points
                const noiseColor = Math.random() < 0.1 ? accentColor : '#ffffff'; // 10% chance of accent color

                ctx.fillStyle = `rgba(${parseInt(noiseColor.slice(1,3), 16)}, ${parseInt(noiseColor.slice(3,5), 16)}, ${parseInt(noiseColor.slice(5,7), 16)}, ${alpha})`;
                ctx.fillRect(x, y, size, size);
            }

             // Optional: Add a subtle overall noise overlay (using a separate canvas or context property)
             // This is more complex and might require a dedicated noise generation function or image.
             // Skipping for this update to keep it focused on the main shapes and points.
        }


        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'voxel-background.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Initial generation on page load
        generate();

        // Regenerate on window resize
        window.addEventListener('resize', generate);

        // Add listeners to input changes to regenerate preview automatically
        document.getElementById("widthInput").addEventListener('change', generate);
        document.getElementById("heightInput").addEventListener('change', generate);
        document.getElementById("noisinessInput").addEventListener('input', generate); // Use input for sliders/number fields
        document.getElementById("noiseDensityInput").addEventListener('input', generate);
        document.getElementById("bgColorInput").addEventListener('input', generate);
        document.getElementById("accentColorInput").addEventListener('input', generate);

    </script>
</body>

</html>
